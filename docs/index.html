// ==================== TIPOS DE DATOS ====================
// Cada tipo describe la estructura de un registro (fila) de la base de datos.

// Una materia del semestre: identificada por id único, con datos académicos y color visual
type Materia = {
  id: string;
  nombre: string;
  profesor: string;
  creditos: number;
  color: string; // color asignado automáticamente, usado en tarjetas y horario
  semestre: string; // categoría de agrupación, ej: "2026-2"
};

// Una nota/evaluación que pertenece a una materia
type Nota = {
  id: string;
  materiaId: string; // clave foránea: vincula la nota con su materia
  nombre: string;
  valor: number; // calificación en escala 0 - 5
  porcentaje: number; // peso de esta evaluación en la nota final (ej: 30 = 30%)
};

// Una clase dentro del horario semanal
type Clase = {
  id: string;
  materiaId: string; // clave foránea: vincula la clase con su materia
  dia: number; // índice del día: 0 = Lunes ... 5 = Sábado
  inicio: string; // hora de inicio en formato "07:00"
  fin: string; // hora de fin en formato "09:00"
  salon: string; // aula o salón (opcional)
};

// Configuración global de la app (tabla singleton "config", una sola fila)
type Config = {
  email: string; // correo inscrito para recibir recordatorios
  recordatorios: boolean; // interruptor de recordatorios
  umbral: number; // las notas por debajo de este valor se resaltan en rojo
};

// Paleta de colores: cada materia nueva toma el siguiente color de forma cíclica
const COLORS = ["#6366f1", "#10b981", "#f59e0b", "#ef4444", "#3b82f6", "#ec4899", "#8b5cf6", "#14b8a6"];
// Días visibles en el horario; el índice en este arreglo corresponde a Clase.dia
const DIAS = ["Lunes", "Martes", "Miércoles", "Jueves", "Viernes", "Sábado"];

// ==================== CAPA DE BASE DE DATOS (MiniDB) ====================
/**
 * MiniDB: motor de base de datos embebido inspirado en un ORM simple.
 *
 * Diseño:
 * - La "base de datos" es un objeto { tableName: rows[] } serializado a JSON
 *   en localStorage bajo la clave DB_KEY. Cada tabla es un arreglo de filas.
 * - Expone una API CRUD genérica (insert / find / update / remove / drop),
 *   de modo que la UI nunca toca localStorage ni arreglos crudos: solo habla
 *   con la API de la DB. Así, si mañana se conecta un backend real (Firebase,
 *   Supabase, API REST), basta con reemplazar la implementación interna de
 *   estos métodos y el resto de la app no cambia.
 * - Operaciones:
 *   • insert(table, row)  -> agrega una fila y devuelve el registro completo
 *   • find(table, filter) -> consulta con predicado (como un WHERE); sin filtro = SELECT *
 *   • update(table, id, patch) -> UPDATE parcial por clave primaria
 *   • remove(table, id)   -> DELETE por clave primaria
 *   • removeWhere(table, filter) -> DELETE con condición (para borrado en cascada)
 *   • getTable(table)      -> lectura directa de la tabla (para el estado de React)
 *   • getConfig() / saveConfig() -> helpers para la tabla singleton "config"
 * - Cada mutación hace persist() inmediatamente: no hay que recordar guardar.
 */
const DB_KEY = "seguidor-notas-db";

// Esquema por defecto: cada tabla se inicializa como arreglo vacío,
// y config arranca con sus valores por defecto en la fila 0.
const DB_SCHEMA = {
  materias: [] as Materia[],
  notas: [] as Nota[],
  clases: [] as Clase[],
  config: [{ email: "", recordatorios: true, umbral: 3.0 }], // singleton: siempre fila 0
};

// Tipos de fila: todo registro tiene un `id` como clave primaria
type Row = { id: string; [k: string]: any };

const MiniDB = {
  /** Carga la DB completa desde localStorage; si no existe o está corrupta,
   *  se crea con el esquema por defecto (como un CREATE TABLE IF NOT EXISTS). */
  load(): typeof DB_SCHEMA {
    try {
      const raw = localStorage.getItem(DB_KEY);
      if (raw) {
        const parsed = JSON.parse(raw);
        // Merge tabla por tabla: las tablas nuevas del esquema siempre existen
        return { ...DB_SCHEMA, ...parsed };
      }
    } catch {} // JSON corrupto o storage bloqueado -> usar esquema por defecto
    return { ...DB_SCHEMA, config: [{ ...DB_SCHEMA.config[0] }] };
  },

  /** Persiste la DB completa en localStorage tras cada mutación. */
  persist(db: typeof DB_SCHEMA) {
    localStorage.setItem(DB_KEY, JSON.stringify(db));
  },

  /** INSERT: agrega una fila a la tabla y la devuelve (ya con su id). */
  insert<T extends Row>(table: keyof typeof DB_SCHEMA, row: T): T {
    const db = MiniDB.load();
    (db[table] as T[]).push(row);
    MiniDB.persist(db);
    return row;
  },

  /** SELECT (con WHERE opcional): filtra la tabla con un predicado. */
  find<T extends Row>(table: keyof typeof DB_SCHEMA, filter?: (r: T) => boolean): T[] {
    const rows = MiniDB.load()[table] as T[];
    return filter ? rows.filter(filter) : rows.slice(); // slice() evita exponer el arreglo interno
  },

  /** UPDATE parcial: busca la fila por clave primaria y fusiona el patch. */
  update<T extends Row>(table: keyof typeof DB_SCHEMA, id: string, patch: Partial<T>): void {
    const db = MiniDB.load();
    const rows = db[table] as T[];
    const i = rows.findIndex((r) => r.id === id);
    if (i !== -1) rows[i] = { ...rows[i], ...patch };
    MiniDB.persist(db);
  },

  /** DELETE por id: elimina la fila con esa clave primaria. */
  remove(table: keyof typeof DB_SCHEMA, id: string): void {
    MiniDB.removeWhere(table, (r: Row) => r.id === id);
  },

  /** DELETE con condición: elimina todas las filas que cumplan el filtro.
   *  Se usa para el borrado en cascada (ej: todas las notas de una materia). */
  removeWhere(table: keyof typeof DB_SCHEMA, filter: (r: Row) => boolean): void {
    const db = MiniDB.load();
    db[table] = (db[table] as Row[]).filter((r) => !filter(r));
    MiniDB.persist(db);
  },

  /** Limpia la DB completa y vuelve al esquema inicial (como TRUNCATE + reseed). */
  reset(): typeof DB_SCHEMA {
    localStorage.removeItem(DB_KEY);
    return MiniDB.load();
  },

  /** Lee la fila 0 de la tabla singleton config. */
  getConfig(): Config {
    return MiniDB.load().config[0];
  },

  /** UPDATE de la config: fusiona el patch sobre la fila 0. */
  saveConfig(patch: Partial<Config>): void {
    const db = MiniDB.load();
    db.config[0] = { ...db.config[0], ...patch };
    MiniDB.persist(db);
  },
};

// Generador de ids pseudoaleatorios (clave primaria de cada fila)
const uid = () => Math.random().toString(36).slice(2, 10);

/**
 * Calcula el promedio ponderado de una materia (consulta agregada sobre la DB).
 *
 * Ejemplo: Parcial 1 (4.0, 30%) + Trabajo (5.0, 70%) => (4.0*30 + 5.0*70) / 100 = 4.7
 * Si no hay notas (o la suma de pesos es 0), devuelve null para que la UI
 * muestre el estado "sin promedio" y evita la división por cero.
 */
function promedio(notas: Nota[], materiaId: string) {
  const ns = notas.filter((n) => n.materiaId === materiaId); // WHERE materiaId = ?
  const totalPeso = ns.reduce((s, n) => s + n.porcentaje, 0);
  if (!ns.length || totalPeso === 0) return null;
  return ns.reduce((s, n) => s + n.valor * n.porcentaje, 0) / totalPeso;
}

// ==================== ESTILOS REUTILIZABLES ====================
// Clases Tailwind compartidas para mantener consistencia visual y evitar repetición

const card = "bg-white rounded-2xl border border-slate-200 shadow-sm p-5"; // tarjeta base
const input =
  "w-full rounded-lg border border-slate-300 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-400"; // campo de formulario
const label = "block text-xs font-semibold text-slate-500 mb-1 uppercase tracking-wide"; // etiqueta de campo

/**
 * Botón genérico con 3 variantes de color ("tones"):
 * - primary: acción principal (fondo indigo sólido)
 * - soft:    acción secundaria (fondo suave)
 * - danger:  acción destructiva (solo texto rojo, sin fondo)
 */
function Btn({ children, onClick, tone = "primary", className = "" }: any) {
  const tones = {
    primary: "bg-indigo-600 text-white hover:bg-indigo-700",
    soft: "bg-indigo-50 text-indigo-700 hover:bg-indigo-100",
    danger: "text-red-500 hover:bg-red-50",
  };
  return (
    <button
      onClick={onClick}
      className={`rounded-lg px-3 py-2 text-sm font-medium transition ${tones[tone]} ${className}`}
    >
      {children}
    </button>
  );
}

// ==================== HOOK DE ESTADO CONECTADO A LA DB ====================
/**
 * useDB: sincroniza el estado de React con la capa de base de datos.
 *
 * - Al montarse hace un "SELECT *" de las cuatro tablas y las copia al estado
 *   de React (las tablas son de solo lectura para la UI: los cambios SIEMPRE
 *   pasan por la API de MiniDB y luego se refresca el estado con refresh()).
 * - refresh() relee la DB: como cada mutación ya persistió, el estado de React
 *   queda espejado con la base de datos después de cada operación.
 */
function useDB() {
  const [data, setData] = useState(() => MiniDB.load());

  const refresh = () => setData(MiniDB.load());

  useEffect(() => {
    refresh(); // carga inicial desde localStorage
  }, []);

  return { data, refresh };
}

// ==================== PESTAÑA MATERIAS ====================

/**
 * Vista principal: crear materias, ver promedios y administrar notas.
 * Toda mutación usa la API de MiniDB; refresh() actualiza la vista.
 */
function TabMaterias({ data, refresh }: any) {
  // Estado local del formulario de creación; UI transitoria, no se persiste.
  const [form, setForm] = useState({ nombre: "", profesor: "", creditos: 3, semestre: "2026-2" });

  // INSERT INTO materias: valida nombre, genera id/color, persiste y refresca
  const agregar = () => {
    if (!form.nombre.trim()) return;
    MiniDB.insert<Materia>("materias", {
      id: uid(),
      nombre: form.nombre.trim(),
      profesor: form.profesor.trim(),
      creditos: Number(form.creditos) || 0,
      color: COLORS[MiniDB.find<Materia>("materias").length % COLORS.length],
      semestre: form.semestre.trim() || "Sin semestre", // categoría de agrupación
    });
    setForm({ nombre: "", profesor: "", creditos: 3, semestre: form.semestre.trim() });
    refresh();
  };

  // DELETE en cascada: materia + sus notas + sus clases (por clave foránea)
  const eliminar = (id: string) => {
    MiniDB.remove("materias", id); // DELETE FROM materias WHERE id = ?
    MiniDB.removeWhere("notas", (n) => n.materiaId === id); // notas huérfanas
    MiniDB.removeWhere("clases", (c) => c.materiaId === id); // clases huérfanas
    refresh();
  };

  /**
   * Promedio general ponderado por créditos (como el promedio académico real):
   * suma(promedio_materia * creditos) / suma(creditos).
   * Las materias sin notas (promedio null) se excluyen del cálculo.
   */
  const promedioGeneral = () => {
    let suma = 0, peso = 0;
    data.materias.forEach((m: Materia) => {
      const p = promedio(data.notas, m.id);
      if (p !== null) { suma += p * m.creditos; peso += m.creditos; }
    });
    return peso ? suma / peso : null;
  };

  const pg = promedioGeneral();

  return (
    <div className="space-y-5">
      {/* --- Formulario de creación de materia --- */}
      <div className={card}>
        <h2 className="font-bold text-slate-800 mb-3 flex items-center gap-2">
          <IconPlus size={18} /> Crear materia
        </h2>
        <div className="grid grid-cols-1 sm:grid-cols-5 gap-3">
          <div className="sm:col-span-2">
            <span className={label}>Nombre</span>
            <input className={input} value={form.nombre} placeholder="Ej: Análisis y Diseño de Sistemas I"
              onChange={(e) => setForm({ ...form, nombre: e.target.value })} />
          </div>
          <div>
            <span className={label}>Profesor</span>
            <input className={input} value={form.profesor} placeholder="Opcional"
              onChange={(e) => setForm({ ...form, profesor: e.target.value })} />
          </div>
          <div>
            <span className={label}>Créditos</span>
            <input className={input} type="number" min={0} value={form.creditos}
              onChange={(e) => setForm({ ...form, creditos: e.target.value })} />
          </div>
          <div>
            <span className={label}>Semestre</span>
            <div className="flex gap-2">
              {/* La categoría con la que se agrupará la materia, ej: 2026-2 */}
              <input className={input} placeholder="2026-2" value={form.semestre}
                onChange={(e) => setForm({ ...form, semestre: e.target.value })} />
              <Btn onClick={agregar}>Añadir</Btn>
            </div>
          </div>
        </div>
      </div>

      {/* --- Banner de promedio general (solo si hay al menos una nota) --- */}
      {pg !== null && (
        <div className="rounded-2xl bg-gradient-to-r from-indigo-600 to-violet-600 text-white p-5 shadow-md">
          <div className="text-sm opacity-80">Promedio ponderado general</div>
          <div className="text-4xl font-extrabold">{pg.toFixed(2)} <span className="text-lg font-normal">/ 5.0</span></div>
        </div>
      )}

      {/* --- Tarjetas agrupadas por semestre (GROUP BY semestre) --- */}
      {[...new Set(data.materias.map((m: Materia) => m.semestre || "Sin semestre"))]
        .sort() // orden alfabético/cronológico de los semestres
        .map((sem) => (
          <div key={sem} className="space-y-4">
            {/* Encabezado del grupo de semestre */}
            <h2 className="text-lg font-bold text-slate-700 border-b-2 border-indigo-200 pb-1">
              📁 {sem}
            </h2>
            {data.materias
              .filter((m: Materia) => (m.semestre || "Sin semestre") === sem)
              .map((m: Materia) => {
        // Consultas derivadas: SELECT * FROM notas WHERE materiaId = m.id
        const ns = MiniDB.find<Nota>("notas", (n) => n.materiaId === m.id);
        const p = promedio(data.notas, m.id);
        const pesado = ns.reduce((s: number, n: Nota) => s + n.porcentaje, 0);

        return (
          <div key={m.id} className={card} style={{ borderLeft: `5px solid ${m.color}` }}>
            <div className="flex items-start justify-between gap-3">
              <div>
                <div className="font-bold text-slate-800">{m.nombre}</div>
                <div className="text-sm text-slate-500">
                  {m.profesor || "Sin profesor"} · {m.creditos} créditos · {pesado}% evaluado
                </div>
              </div>
              <div className="flex items-center gap-2">
                {/* Badge verde o rojo según el umbral de alerta de la config */}
                {p !== null && (
                  <span className={`px-3 py-1 rounded-full text-sm font-bold ${
                    p >= data.config[0].umbral ? "bg-emerald-100 text-emerald-700" : "bg-red-100 text-red-700"
                  }`}>
                    {p.toFixed(2)}
                  </span>
                )}
                <Btn tone="danger" onClick={() => eliminar(m.id)}>✕</Btn>
              </div>
            </div>

            {/* Lista de notas; el botón hace DELETE por clave primaria */}
            <div className="mt-3 space-y-2">
              {ns.length === 0 && <div className="text-sm text-slate-400">Sin notas registradas</div>}
              {ns.map((n: Nota) => (
                <div key={n.id} className="flex items-center gap-3 text-sm">
                  <span className="flex-1">{n.nombre} <span className="text-slate-400">({n.porcentaje}%)</span></span>
                  <span className={`font-semibold ${n.valor >= data.config[0].umbral ? "text-emerald-600" : "text-red-500"}`}>
                    {n.valor.toFixed(1)}
                  </span>
                  <button className="text-slate-300 hover:text-red-500"
                    onClick={() => { MiniDB.remove("notas", n.id); refresh(); }}>✕</button>
                </div>
              ))}
            </div>

            <FormNota materiaId={m.id} refresh={refresh} />
          </div>
        );
      })}
          </div>
        ))}
    </div>
  );
}

/**
 * Mini-formulario de alta de notas: INSERT INTO notas validando
 * nombre no vacío, valor en [0, 5] y porcentaje > 0.
 */
function FormNota({ materiaId, refresh }: any) {
  const [f, setF] = useState({ nombre: "", valor: "", porcentaje: "" });

  const add = () => {
    const valor = parseFloat(f.valor), pct = parseFloat(f.porcentaje);
    if (!f.nombre.trim() || isNaN(valor) || valor < 0 || valor > 5 || isNaN(pct) || pct <= 0) return;
    MiniDB.insert<Nota>("notas", {
      id: uid(), materiaId, nombre: f.nombre.trim(), valor, porcentaje: pct,
    });
    setF({ nombre: "", valor: "", porcentaje: "" });
    refresh();
  };

  return (
    <div className="mt-3 grid grid-cols-2 sm:grid-cols-4 gap-2 border-t border-slate-100 pt-3">
      <input className={input} placeholder="Nota (ej: Parcial 1)" value={f.nombre}
        onChange={(e) => setF({ ...f, nombre: e.target.value })} />
      <input className={input} type="number" min={0} max={5} step={0.1} placeholder="Valor 0-5" value={f.valor}
        onChange={(e) => setF({ ...f, valor: e.target.value })} />
      <input className={input} type="number" min={0} placeholder="% peso" value={f.porcentaje}
        onChange={(e) => setF({ ...f, porcentaje: e.target.value })} />
      <Btn tone="soft" onClick={add}>+ Nota</Btn>
    </div>
  );
}

// ==================== PESTAÑA HORARIOS ====================

/**
 * Vista del horario semanal: alta de clases (INSERT INTO clases) y
 * cuadrícula por día alimentada por la DB.
 */
function TabHorarios({ data, refresh }: any) {
  const [f, setF] = useState({ materiaId: "", dia: 0, inicio: "07:00", fin: "09:00", salon: "" });

  // INSERT INTO clases: solo si hay materia seleccionada (evita registros huérfanos)
  const add = () => {
    if (!f.materiaId) return;
    MiniDB.insert<Clase>("clases", { id: uid(), ...f } as Clase);
    refresh();
  };

  // DELETE FROM clases WHERE id = ?
  const del = (id: string) => { MiniDB.remove("clases", id); refresh(); };

  // JOIN manual: resuelve el nombre de la materia desde su id
  const nombre = (id: string) => data.materias.find((m: Materia) => m.id === id)?.nombre ?? "—";

  return (
    <div className="space-y-5">
      <div className={card}>
        <h2 className="font-bold text-slate-800 mb-3 flex items-center gap-2">
          <IconCalendar size={18} /> Agregar clase al horario
        </h2>
        <div className="grid grid-cols-1 sm:grid-cols-6 gap-3">
          <select className={`${input} sm:col-span-2`} value={f.materiaId}
            onChange={(e) => setF({ ...f, materiaId: e.target.value })}>
            <option value="">Selecciona materia…</option>
            {data.materias.map((m: Materia) => <option key={m.id} value={m.id}>{m.nombre}</option>)}
          </select>
          <select className={input} value={f.dia} onChange={(e) => setF({ ...f, dia: Number(e.target.value) })}>
            {DIAS.map((d, i) => <option key={d} value={i}>{d}</option>)}
          </select>
          <input className={input} type="time" value={f.inicio} onChange={(e) => setF({ ...f, inicio: e.target.value })} />
          <input className={input} type="time" value={f.fin} onChange={(e) => setF({ ...f, fin: e.target.value })} />
          <div className="flex gap-2">
            <input className={input} placeholder="Salón" value={f.salon} onChange={(e) => setF({ ...f, salon: e.target.value })} />
            <Btn onClick={add}>Añadir</Btn>
          </div>
        </div>
        {data.materias.length === 0 && (
          <p className="text-sm text-amber-600 mt-2">Primero crea una materia en la pestaña Materias.</p>
        )}
      </div>

      {/* --- Cuadrícula del horario: una columna por día --- */}
      <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
        {DIAS.map((d, i) => {
          // SELECT * FROM clases WHERE dia = i, ordenadas por hora de inicio
          const cs = (data.clases as Clase[]).filter((c) => c.dia === i).sort((a, b) => a.inicio.localeCompare(b.inicio));
          return (
            <div key={d} className="rounded-2xl bg-slate-50 border border-slate-200 p-4 min-h-24">
              <h3 className="font-bold text-slate-700 text-sm uppercase tracking-wide mb-2">{d}</h3>
              {cs.length === 0 && <div className="text-xs text-slate-400">Sin clases</div>}
              <div className="space-y-2">
                {cs.map((c) => {
                  const color = data.materias.find((m: Materia) => m.id === c.materiaId)?.color ?? "#64748b";
                  return (
                    <div key={c.id} className="rounded-lg bg-white border p-2 text-xs shadow-sm group"
                      style={{ borderLeft: `4px solid ${color}` }}>
                      <div className="font-semibold text-slate-700">{nombre(c.materiaId)}</div>
                      <div className="text-slate-500">{c.inicio} – {c.fin}{c.salon ? ` · ${c.salon}` : ""}</div>
                      <button className="text-red-400 opacity-0 group-hover:opacity-100 transition" onClick={() => del(c.id)}>Eliminar</button>
                    </div>
                  );
                })}
              </div>
            </div>
          );
        })}
      </div>
    </div>
  );
}

}

/**
 * Componente raíz: administra la pestaña activa y renderiza la vista correspondiente.
 * Las tres pestañas comparten la misma base de datos vía useDB (data + refresh).
 */
function App() {
  const { data, refresh } = useDB(); // estado espejado de la DB
  const [tab, setTab] = useState<"materias" | "notas" | "horarios">("materias");

  const tabs = [
    { id: "materias", label: "📚 Materias" },
    { id: "notas", label: "📝 Notas" },
    { id: "horarios", label: "🗓️ Horarios" },
  ] as const;

  return (
    <div className="min-h-screen bg-slate-100">
      <div className="max-w-4xl mx-auto p-4 sm:p-8">
        <header className="mb-6">
          <h1 className="text-2xl sm:text-3xl font-extrabold text-slate-800 flex items-center gap-2">
            <IconBook size={28} /> Seguidor de Notas
          </h1>
          <p className="text-slate-500 text-sm">Materias, notas ponderadas, horarios y recordatorios por correo.</p>
        </header>

        {/* Barra de navegación: botón activo resaltado según `tab` */}
        <nav className="flex gap-2 mb-6 bg-white rounded-xl p-1.5 border border-slate-200 shadow-sm w-fit mx-auto sm:mx-0">
          {tabs.map((t) => (
            <button key={t.id}
              onClick={() => setTab(t.id)}
              className={`px-4 py-2 rounded-lg text-sm font-semibold transition ${
                tab === t.id ? "bg-indigo-600 text-white shadow" : "text-slate-600 hover:bg-slate-100"
              }`}>
              {t.label}
            </button>
          ))}
        </nav>

        {tab === "materias" && <TabMaterias data={data} refresh={refresh} />}
        {tab === "notas" && <TabNotas data={data} refresh={refresh} />}
        {tab === "horarios" && <TabHorarios data={data} refresh={refresh} />}

        <footer className="mt-8 text-center text-xs text-slate-400">
          🗄️ Datos guardados en la base de datos local (localStorage) de este navegador.
        </footer>
      </div>
    </div>
  );
}

  </script>

  <script>
    // Errores globales visibles en pantalla (además de la consola)
    function mostrarError(titulo, detalle) {
      var f = document.getElementById("fatal");
      f.style.display = "block";
      f.textContent = titulo + "\n\n" + detalle;
    }
    window.onerror = function (msg, src, line, col) {
      mostrarError("❌ Error de JavaScript: " + msg, (src || "") + " (línea " + line + ", col " + col + ")");
    };

    // Compilación del TSX con diagnóstico visible en cada paso
    try {
      if (typeof React === "undefined") throw new Error("React no cargó desde el CDN (revisa tu conexión o bloqueadores).");
      if (typeof Babel === "undefined") throw new Error("Babel no cargó desde el CDN (revisa tu conexión o bloqueadores).");

      var src = document.getElementById("app-src").textContent;
      if (!src || src.length < 100) throw new Error("El código fuente no se encontró en el DOM.");

      var out;
      try {
        out = Babel.transform(src, {
          presets: [["typescript", { isTSX: true, allExtensions: true }], "react"],
          filename: "App.tsx"
        });
      } catch (e) {
        mostrarError("❌ Error compilando el código TSX:", e.message);
        throw e;
      }

      try {
        var s = document.createElement("script");
        s.textContent = out.code;
        document.body.appendChild(s);
      } catch (e) {
        mostrarError("❌ Error ejecutando la app compilada:", e.message);
        throw e;
      }
    } catch (e) {
      console.error(e);
    }
  </script>
</body>
