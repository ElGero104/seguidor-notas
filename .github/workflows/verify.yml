name: Verificar app

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verificar:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # Compilar el bundle modular (atrapa errores de sintaxis/imports antes de Pages)
      - name: Compilar bundle src/main.tsx -> docs/app.js
        run: |
          npm install --no-save esbuild@0.24.0
          node scripts/build-web.mjs

      - name: Verificar que docs/index.html carga el bundle y estÃ¡ completo
        run: |
          grep -q 'src="./app.js"' docs/index.html
          grep -q '</html>' docs/index.html
          test -s docs/app.js
          node --check docs/app.js

      - name: Tests de fÃ³rmulas
        run: node scripts/test-formulas.cjs

      - name: Iconos PWA
        run: |
          mkdir -p docs/icons
          base64 -d scripts/iconos/icon-192.png.b64 > docs/icons/icon-192.png
          base64 -d scripts/iconos/icon-512.png.b64 > docs/icons/icon-512.png
          base64 -d scripts/iconos/maskable-512.png.b64 > docs/icons/maskable-512.png
          test -s docs/icons/icon-192.png
          test -s docs/icons/icon-512.png
          test -s docs/icons/maskable-512.png

      - name: Confirmar si cambiaron
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/app.js docs/icons
          if git diff --cached --quiet; then
            echo "Sin cambios"
          else
            git commit -m "chore: regenerar bundle e iconos"
            git push
          fi
